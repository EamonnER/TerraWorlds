name: PR Template Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Validate PR checkboxes
        run: |
          # Remove Windows-style line endings
          PR_BODY=$(echo "$PR_BODY" | tr -d '\r')
          
          REQUIRED_ITEMS=(
            "- [x] I have tested the changes locally"
            "- [x] I have reviewed and cleaned all AI-generated code (if applicable)"
            "- [x] I am using a version of Godot equal to or higher than the version on \`main\`"
          )
          
          MISSING=0
          
          for ITEM in "${REQUIRED_ITEMS[@]}"; do
            if [[ "$PR_BODY" != *"$ITEM"* ]]; then
              echo "❌ Checklist item not completed: $ITEM"
              MISSING=$((MISSING + 1))
            fi
          done
          
          if [[ $MISSING -gt 0 ]]; then
            echo "PR checklist validation failed. Please check all required boxes."
            exit 1
          else
            echo "✅ All required checklist items are completed."
          fi

      - name: Validate PR description
        run: |
          # Remove Windows-style line endings
          PR_BODY=$(echo "$PR_BODY" | tr -d '\r')
          
          DESCRIPTION=$(echo "$PR_BODY" | sed -n '/<!-- START-DESCRIPTION -->/,/<!-- END-DESCRIPTION -->/p' | sed '1d;$d' | tr -d '[:space:]')
          
          if [[ -z "$DESCRIPTION" ]]; then
            echo "❌ PR description is empty. Please provide a description between <!-- START-DESCRIPTION --> and <!-- END-DESCRIPTION -->"
            exit 1
          else
            echo "✅ PR description is populated."
          fi
